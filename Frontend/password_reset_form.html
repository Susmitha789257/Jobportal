<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background-color:#f4f4f4;">

<div class="container" style="margin-top: 90px; max-width: 600px;">
    <div class="row">
        <div class="col-12">
            <div class="card shadow p-4">

                <h2 class="text-center mb-4" style="color: brown;">Forgot Password</h2>

                <!-- FORM -->
                <!-- IMPORTANT:
                     action should point to BACKEND password-reset API endpoint
                     Example:
                     http://BACKEND_IP:8000/password_reset/
                -->
                <form method="post" action="/api/password_reset/">

                    <div class="mb-3">
                        <label for="email" class="form-label" style="font-size: 18px;">
                            Registered Email Address
                        </label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            class="form-control"
                            required
                            placeholder="Enter your registered email"
                        >
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">
                            Reset Password
                        </button>
                    </div>

                </form>

            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
