<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Confirm Password Reset</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(to right, #dde08d, #85de88, #67dce0);
      font-family: Arial, sans-serif;
    }

    .reset-box {
      margin-top: 120px;
      max-width: 500px;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <div id="navbar"></div>

  <div class="container d-flex justify-content-center">
    <div class="reset-box">
      <div class="alert alert-success text-center">
        <h3>Confirm Password Reset</h3>
      </div>

      <!-- FRONTEND FORM -->
      <form action="/api/password_reset_confirm/" method="POST">
        <div class="mb-3">
          <label class="form-label">New Password</label>
          <input
            type="password"
            name="new_password1"
            class="form-control"
            placeholder="New password"
            required
          >
        </div>

        <div class="mb-3">
          <label class="form-label">Confirm Password</label>
          <input
            type="password"
            name="new_password2"
            class="form-control"
            placeholder="Confirm password"
            required
          >
        </div>

        <button type="submit" class="btn btn-primary w-100">
          Set New Password
        </button>
      </form>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Load Navbar -->
  <script>
    fetch("include/navbar.html")
      .then(res => res.text())
      .then(data => document.getElementById("navbar").innerHTML = data);
  </script>

</body>
</html>
