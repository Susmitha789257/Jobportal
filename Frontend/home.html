<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Job Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/register.css">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-image: repeating-linear-gradient(
        45deg,
        transparent,
        transparent 20px,
        #f6d7e9 20px,
        #dbe8e7 40px
      );
    }
    .card-body {
      background: url("/images/hii.jpg") center/cover;
    }
  </style>
</head>

<body>

<!-- NAVBAR -->
<div id="navbar"></div>

<div class="container" style="margin-top: 80px;">
  <h2 class="text-primary fw-bold mb-4">Welcome to Job Portal</h2>

  <div class="row" id="jobs-container">
    <!-- Jobs will be injected here by JS -->
  </div>
</div>

<!-- FOOTER -->
<div id="footer"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- MAIN JS -->
<script>
  const BACKEND_API = "http://15.168.37.255:8000/api/jobs/"; // CHANGE if needed

  // Load jobs
  fetch(BACKEND_API)
    .then(res => res.json())
    .then(data => {
      const container = document.getElementById("jobs-container");
      container.innerHTML = "";

      data.forEach(job => {
        container.innerHTML += `
          <div class="col-4 mb-4">
            <div class="card">
              <div class="card-body">
                <h3 class="fw-bold text-danger">${job.job_name}</h3>
                <p>
                  <b>Experience:</b> ${job.min_experience} - ${job.max_experience} Years<br>
                  <b>Skills:</b> ${job.skills}<br>
                  <b>Vacancy:</b> ${job.openings}<br>
                  <b>Education:</b> ${job.education}<br>
                  <b>Package:</b> ${job.min_package} - ${job.max_package} LPA<br>
                  <b>Work Mode:</b> ${job.work_mode}<br>
                  <b>Description:</b> ${job.job_description}
                </p>

                <div class="text-end">
                  <a href="/login.html" class="btn btn-primary">Login to Apply</a>
                </div>
              </div>
            </div>
          </div>
        `;
      });
    })
    .catch(err => {
      console.error("Error loading jobs", err);
    });

  // Load navbar & footer
  fetch("/include/navbar.html").then(r => r.text()).then(d => document.getElementById("navbar").innerHTML = d);
  fetch("/include/footer.html").then(r => r.text()).then(d => document.getElementById("footer").innerHTML = d);
</script>

</body>
</html>
