<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Job Application Form</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body.apply-body {
      background: url("images/hero.jpg") center/cover no-repeat;
      min-height: 100vh;
    }

    .table-container {
      background-color: rgb(162, 188, 240);
      padding: 20px;
      border-radius: 10px;
      margin-top: 20px;
      width: 40%;
      margin-left: auto;
      margin-right: auto;
      text-align: center;
    }

    table {
      width: 90%;
      margin: auto;
    }

    table tr,
    table td {
      padding: 8px;
    }

    table th {
      background-color: rgb(230, 255, 172);
      padding: 8px;
      text-align: center;
    }

    button {
      margin-top: 10px;
      padding: 8px 25px;
    }
  </style>
</head>

<body class="apply-body">

  <!-- Navbar -->
  <div id="navbar"></div>

  <h2 style="margin-top:80px; text-align:center; color:blue;">
    Job Application Form
  </h2>

  <!-- Success message (static placeholder) -->
  <div class="alert alert-success text-center"
       style="background-color:red; color:white; padding:6px; margin-top:10px; border-radius:5px;">
    Application submitted successfully
  </div>

  <div class="table-container">
    <form>

      <table>
        <tr>
          <th>Full Name</th>
          <td><input type="text" class="form-control" placeholder="Enter full name"></td>
        </tr>

        <tr>
          <th>Email</th>
          <td><input type="email" class="form-control" placeholder="Enter email"></td>
        </tr>

        <tr>
          <th>Phone</th>
          <td><input type="text" class="form-control" placeholder="Enter phone number"></td>
        </tr>

        <tr>
          <th>Upload Resume</th>
          <td><input type="file" class="form-control"></td>
        </tr>

        <tr>
          <td colspan="2" style="text-align:center;">
            <button type="submit" class="btn btn-primary">Submit</button>
          </td>
        </tr>
      </table>

    </form>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Navbar include -->
  <script>
    fetch("/include/navbar.html")
      .then(res => res.text())
      .then(data => document.getElementById("navbar").innerHTML = data);
  </script>

</body>
</html>
