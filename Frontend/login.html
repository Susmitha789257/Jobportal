<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Login Page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <!-- Project CSS -->
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/register.css">

  <style>
    body {
      background: linear-gradient(to right, #dde08d, #85de88, #67dce0);
    }
    .center-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .login-form {
      max-width: 400px;
      width: 100%;
      border: 2px solid rgb(211, 169, 211);
      padding: 15px;
      background-color: #ff00ae;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<div class="container center-container">
  <div class="row">
    <div class="col-12 text-center mb-2">
      <h2 class="text-primary fw-bold">SDE User Login Form</h2>
    </div>
  </div>

  <!-- Message container -->
  <div id="message1-container"></div>

  <section class="py-4">
    <div class="login-form">
      <form id="loginForm">
        <div class="mb-4">
          <label class="form-label" style="color: purple; font-size: 20px;">User Name :</label>
          <input type="text" id="username" class="form-control" placeholder="Enter User Name" required>
        </div>

        <div class="mb-4">
          <label class="form-label" style="color: purple; font-size: 20px;">Password :</label>
          <input type="password" id="password" class="form-control" placeholder="Enter Password" required>
        </div>

        <button type="submit" class="btn btn-primary mb-2 w-100">Login</button>

        <a href="/password_reset_form.html" class="d-block text-center text-white">Forgot Password?</a>
      </form>
    </div>

    <div class="row mt-3">
      <div class="col-12 text-center">
        <p class="text-dark">
          Don't have an account?
          <a href="/register.html">Create New Account</a>
        </p>
      </div>
    </div>
  </section>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Inline JS for backend login -->
<script>
  function showMessage(message) {
    document.getElementById("message1-container").innerHTML = `
      <div class="alert alert-info alert-dismissible fade show"
           style="font-weight:bold; background-color:orange;">
        ${message}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>`;
  }

  document.getElementById("loginForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    const response = await fetch("/api/login/", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: document.getElementById("username").value,
        password: document.getElementById("password").value
      })
    });

    const data = await response.json();

    if (response.ok) {
      window.location.href = "/home.html";
    } else {
      showMessage(data.error || "Invalid login credentials");
    }
  });
</script>

</body>
</html>
