<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Applied Jobs</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-image: repeating-linear-gradient(
        45deg,
        transparent,
        transparent 20px,
        #f6d7e9 20px,
        #dbe8e7 40px
      );
    }

    .table {
      width: 90%;
      border-collapse: collapse;
      margin-top: 20px;
      background-color: #fbff81;
    }

    .table th,
    .table td {
      padding: 12px;
      text-align: left;
      border: 1px solid #e60a0a;
      font-weight: bold;
    }

    .table thead {
      background-color: #067ff8;
      color: white;
    }

    .table tbody tr:nth-child(even) {
      background-color: #ffcbe2;
    }

    .badge {
      padding: 8px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <div id="navbar"></div>

  <div class="container" style="margin-top: 80px;">
    <h2 class="mb-4" style="color: #ff1e0aef; font-weight: bold;">
      Jobs Applied
    </h2>

    <div class="container">
      <table class="table table-bordered">
        <thead>
          <tr>
            <th>Application ID</th>
            <th>Job Name</th>
            <th>Applied At</th>
            <th>Status</th>
          </tr>
        </thead>

        <tbody>
          <!-- SAMPLE STATIC ROWS (replace later with API data) -->
          <tr>
            <td>101</td>
            <td>Python Developer</td>
            <td>2026-02-01</td>
            <td>
              <span class="badge bg-success">Shortlisted</span>
            </td>
          </tr>

          <tr>
            <td>102</td>
            <td>DevOps Engineer</td>
            <td>2026-01-28</td>
            <td>
              <span class="badge bg-danger">Not Shortlisted</span>
            </td>
          </tr>

          <tr>
            <td>103</td>
            <td>Backend Engineer</td>
            <td>2026-01-25</td>
            <td>
              <span class="badge bg-secondary">In Review</span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Navbar include -->
  <script>
    fetch("/include/navbar.html")
      .then(res => res.text())
      .then(data => document.getElementById("navbar").innerHTML = data);
  </script>

</body>
</html>
