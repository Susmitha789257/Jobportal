<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact History</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f3f3f3;
      font-family: Arial, sans-serif;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background-color: #e9cbcb;
    }

    th, td {
      border: 1px solid #0e0101;
      padding: 8px;
      text-align: left;
    }

    th {
      background-color: #79dba2;
      font-weight: bold;
    }

    .container {
      margin-top: 80px;
      background: white;
      padding: 20px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <div id="navbar"></div>

  <div class="container">
    <h2 class="text-center mb-4" style="color:red; font-weight:bold;">
      Contact History
    </h2>

    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Message</th>
          <th>Response</th>
        </tr>
      </thead>

      <tbody id="history-table">
        <!-- Static demo row -->
        <tr>
          <td>Susmitha</td>
          <td>atigaddasusmitha789@gmail.com</td>
          <td>Hello, I need help</td>
          <td style="font-weight:bold; text-align:center;">Pending</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Load navbar -->
  <script>
    fetch("include/navbar.html")
      .then(res => res.text())
      .then(data => document.getElementById("navbar").innerHTML = data);
  </script>

</body>
</html>
