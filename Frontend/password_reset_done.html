<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Password Reset Email Sent</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(to right, #dde08d, #85de88, #67dce0);
      font-family: Arial, sans-serif;
    }

    .message-box {
      margin-top: 120px;
      max-width: 600px;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <div id="navbar"></div>

  <div class="container d-flex justify-content-center">
    <div class="message-box">
      <div class="alert alert-success text-center" role="alert">
        <h3>Password Reset Email Sent</h3>
      </div>

      <p class="text-center">
        Dear User,<br><br>
        We’ve sent you an email with instructions to reset your password.<br>
        Please check your inbox (and spam folder) and follow the link provided
        to complete the process.
      </p>

      <div class="text-center mt-4">
        <a href="/login.html" class="btn btn-primary">Back to Login</a>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Load Navbar -->
  <script>
    fetch("include/navbar.html")
      .then(res => res.text())
      .then(data => document.getElementById("navbar").innerHTML = data);
  </script>

</body>
</html>
